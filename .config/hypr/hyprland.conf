source = ~/.config/hypr/rog-flow-x13-2021-binds.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf

exec-once =  dbus-update-activation-environment --systemd --all

# bluetooth and nm
exec-once = uwsm app -- nm-applet --indicator
exec-once = uwsm app -- wl-paste --type text --watch cliphist store
exec-once = uwsm app -- wl-paste --type image --watch cliphist store
exec-once = uwsm app -- blueman-tray 

exec-once = uwsm app -- udiskie

# Desktop 
exec-once = uwsm app -- hypridle
exec-once = uwsm app -- hyprpanel
exec-once = uwsm app -- hyprlock
exec-once = uwsm app -- swww restore

# monitors
monitor=,highres,auto,1

# Set programs that you use
$terminal = kitty --single-instance
$browser = zen-browser
$fileManager = thunar
$menu = pgrep -x rofi >/dev/null 2>&1 && killall rofi || ~/.config/rofi/launchers/type-2/launcher.sh

input {
    kb_layout = us
    follow_mouse=2
    mouse_refocus=false
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    gaps_in = 2 
    gaps_out = 2 
    border_size = 1 
    resize_on_border= true
    col.active_border=rgb(404040)

    col.inactive_border = rgba(595959aa)
    layout = dwindle
    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    rounding = 5
    blur {
        enabled = true
        size = 7
        passes = 4
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 4
        render_power= 3
        color = rgba(1a1a1aee)
    }
    blurls = lockscreen
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
workspace = w[t1], gapsout:0, gapsin:0
workspace = w[tg1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrulev2 = bordersize 0, floating:0, onworkspace:w[t1]
windowrulev2 = rounding 0, floating:0, onworkspace:w[t1]
windowrulev2 = bordersize 0, floating:0, onworkspace:w[tg1]
windowrulev2 = rounding 0, floating:0, onworkspace:w[tg1]
windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

dwindle {
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
    smart_split = true
}

master {
    new_status = master
}

gesture = 4, horizontal, workspace
gesture = 4, down, mod: ALT, close
gesture = 4, up, mod: SUPER, scale: 1.5, fullscreen

misc {
    disable_hyprland_logo = yes
}

xwayland {
  force_zero_scaling = true
}

$touchpad_enabled = 1
device {
    name = elan1201:00-04f3:3098-touchpad
    sensitivity = -0.05
    enabled = $touchpad_enabled
}

windowrule = float,title:^(pavucontrol)$
windowrule = float,title:^(blueman-manager)$
windowrule = float,title:^(nm-connection-editor)$
windowrule = float, title:^(btop)$
windowrule = float, title:^(wofi)$

windowrulev2 = opacity 0.8 0.8,class:^(thunar)$
windowrulev2 = opacity 0.8 0.6,class:^(wofi)$
windowrulev2 = opacity 0.9 0.8,class:^(kitty)$
windowrulev2 = stayfocused, title:^()$,class:^(steam)$
windowrulev2 = minsize 1 1, title:^()$,class:^(steam)$

$mainMod = SUPER
$mainMod2 = ALT

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal 
bind = $mainMod, B, exec, $browser
bind = $mainMod, W, killactive,
bind = $mainMod, F, fullscreen,
bind = $mainMod, L, exec, wlogout --buttons-per-row=4 --protocol layer-shell # show the logout window
bind = $mainMod SHIFT, M, exit, # Exit Hyprland all together no (force quit Hyprland)
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, M, togglefloating,
bind = $mainMod, SPACE, exec, $menu # Show the graphical app launcher
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, D, togglesplit, dwindle
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f - # take a screenshot

bind = $mainMod2, SPACE, exec, cliphist list | rofi --hide-scrollbar -dmenu | cliphist decode | wl-copy
bind = $mainMod2, PERIOD, exec, rofimoji

# Move focus with mainMod + arrow keys
bind = $mainMod2, h, movefocus, l
bind = $mainMod2, l, movefocus, r
bind = $mainMod2, j, movefocus, d
bind = $mainMod2, k, movefocus, u

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, T, togglegroup, 
bind = $mainMod, TAB, changegroupactive,f 

# special workspace (scratchpad)
bind = $mainMod, I, togglespecialworkspace, magic
bind = $mainMod SHIFT, I, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
