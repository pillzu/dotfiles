source = ~/.config/hypr/rog-flow-x13-2021-binds.conf
source = ~/.config/hypr/env_var.conf
source = ~/.config/hypr/env_var_nvidia.conf

exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP 
exec-once = ./xdg-portal.sh
exec-once = hyprpm enable Hyprspace     

exec-once = hypridle

# monitors
monitor=eDP-1,1920x1200@60,0x0,1
monitor=desc:Xiaomi Corporation A24FAA-RG 4440230107903,preferred,1920x0,0.8 # Xiaomi
monitor=desc:Samsung Electric Company S24F350 H4ZJ602887,preferred,4320x0,0.8 # Samsung (4320 - 1920) * 0.8 = 1920
monitor=,preferred,auto,auto

# Attach workspaces
workspace=1, monitor:eDP-1, persistent:true
workspace=4, monitor:desc:Xiaomi Corporation A24FAA-RG 4440230107903
workspace=7, monitor:desc:Samsung Electric Company S24F350 H4ZJ602887

# Execute your favorite apps at launch
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Desktop 
exec-once = swww-daemon 
exec-once = waybar
exec-once = waypaper --restore

# bluetooth and nm
exec-once = blueman-applet
exec-once = nm-applet --indicator
exec-once = wl-paste --watch cliphist store

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = pgrep -x wofi >/dev/null 2>&1 && killall wofi || wofi --dmenu --show drun

input {
    kb_layout = us
    follow_mouse=2
    mouse_refocus=false
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    gaps_in = 2 
    gaps_out = 2 
    border_size = 1 
    resize_on_border= true
    col.active_border=rgb(1B1512)
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    rounding = 5
    blur {
        enabled = true
        size = 7
        passes = 4
        new_optimizations = true
    }
    blurls = lockscreen
    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
    no_gaps_when_only = 1
}

master {
    new_status = master
}

gestures {
    workspace_swipe = on
    workspace_swipe_fingers = 4
}

misc {
    disable_hyprland_logo = yes
    # no_direct_scanout=true
}

xwayland {
  force_zero_scaling = true
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

windowrule = float,^(pavucontrol)$
windowrule = float,^(blueman-manager)$
windowrule = float,^(nm-connection-editor)$
windowrule = float, title:^(btop)$
windowrule = float, title:^(wofi)$

windowrulev2 = opacity 0.8 0.8,class:^(thunar)$
windowrulev2 = opacity 0.8 0.6,class:^(wofi)$
windowrulev2 = opacity 0.9 0.8,class:^(kitty)$
windowrulev2 = stayfocused, title:^()$,class:^(steam)$
windowrulev2 = minsize 1 1, title:^()$,class:^(steam)$

$mainMod = SUPER
$mainMod2 = ALT

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, B, exec, firefox
bind = $mainMod, W, killactive,
bind = $mainMod, F, fullscreen,
bind = $mainMod, M, exec, wlogout --protocol layer-shell # show the logout window
bind = $mainMod SHIFT, M, exit, # Exit Hyprland all together no (force quit Hyprland)
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, SPACE, exec, $menu # Show the graphical app launcher
bind = $mainMod, PERIOD, exec, wofi-emoji 
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, D, togglesplit, dwindle
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f - # take a screenshot

bind = $mainMod2, v, exec, cliphist list | wofi --hide-scrollbar -dmenu | cliphist decode | wl-copy

# Move focus with mainMod + arrow keys
bind = $mainMod2, h, movefocus, l
bind = $mainMod2, l, movefocus, r
bind = $mainMod2, j, movefocus, d
bind = $mainMod2, k, movefocus, u

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, T, togglegroup, 
bind = $mainMod, TAB, changegroupactive,f 

bind = $mainMod2, TAB, overview:toggle

# special workspace (scratchpad)
bind = $mainMod, I, togglespecialworkspace, magic
bind = $mainMod SHIFT, I, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, N, exec, killall -SIGUSR1 waybar
