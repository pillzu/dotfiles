# ROG Flow X13 (2021) Specific binds
bind = ,156, exec, rog-control-center

bind = ,256, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
binde = ,122, exec, wpctl set-volume @DEFAULT_SINK@ 0.05- -l 1
binde = ,123, exec, wpctl set-volume @DEFAULT_SINK@ 0.05+ -l 1


# Fn Keys activated actions
bind = ,121, exec, wpctl set-mute @DEFAULT_SINK@ toggle # f1
bind = ,237, exec, asusctl -p # f2
bind = ,238, exec, asusctl -n  # f3
bind = ,202, exec, asusctl led-mode --next # f4
bind = ,211, exec, asusctl profile --next # f5
binde = ,232, exec, brightnessctl set 10%- # f7
binde = ,233, exec, brightnessctl set +10% # f8
bind = ,211, exec,  ~/.config/scripts/disable-touchpad


bindl = ,switch:on:Asus WMI hotkeys, exec, iio-hyprland
bindl = ,switch:off:Asus WMI hotkeys, exec, pkill iio-hyprland
