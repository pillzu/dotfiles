# ROG Flow X13 (2021) Specific binds
bindr = ,122, exec, ~/.config/scripts/volume --dec #dedicated volume up
bindr = ,123, exec, ~/.config/scripts/volume --inc # dedicated volume down
bind = ,256, exec, ~/.config/scripts/volume --toggle-mic # dedicated mic 
bind = ,156, exec, rog-control-center

# Fn Keys activated actions
bind = ,121, exec, ~/.config/scripts/volume --toggle # f1
binde = ,237, exec, asusctl -p # f2
binde = ,238, exec, asusctl -n  # f3
bind = ,202, exec, asusctl led-mode -n # f4
bind = ,211, exec, ~/.config/scripts/power_profile next
bind = ,232, exec, ~/.config/scripts/brightness --dec
bind = ,233, exec, ~/.config/scripts/brightness --inc

bindl = ,switch:on:Asus WMI hotkeys, exec, iio-hyprland
bindl = ,switch:off:Asus WMI hotkeys, exec, pkill iio-hyprland
